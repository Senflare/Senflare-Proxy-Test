name: probe A vantage point

on:
  workflow_dispatch:

concurrency:
  group: probe-a            # 与主流程分开，避免取消正在跑的判定任务
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 外部探针（入口能力 A）
        run: |
          python probeA.py
          echo "--- 探测点出口 IP ---"
          curl -s https://api.ipinfo.io/lite/ 2>/dev/null || curl -s https://ifconfig.me || true
          echo