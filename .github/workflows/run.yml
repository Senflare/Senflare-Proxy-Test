name: Senflare Proxy Test

# 定时跑优选测试：拉取多源 → TCP/HTTP 检测 → 地区补全 → 提交结果文件
on:
  schedule:
    - cron: '23 */3 * * *'    # 每 3 小时一次（UTC，避开整点高峰）
  workflow_dispatch:           # 支持手动触发

permissions:
  contents: write              # 允许提交结果文件回仓库

concurrency:                    # 上一次还没跑完时不叠加新任务
  group: senflare-proxy-test
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📦 检出仓库
        uses: actions/checkout@v4

      - name: 🐍 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🔎 运行优选测试（零依赖，纯标准库）
        run: python Start.py

      - name: 💾 提交结果与地区缓存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 分开 add：任一文件本次未生成（如无节点需查地区时没有缓存文件）不影响另一个的提交
          git add Senflare-Proxy.txt || true
          git add Senflare-Country.json || true
          if git diff --cached --quiet; then
            echo "✅ 结果无变化，跳过提交"
          else
            git commit -m "🔄 更新优选结果 $(date -u +%Y-%m-%d_%H:%M) [skip ci]"
            git push
          fi
