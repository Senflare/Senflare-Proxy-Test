name: Senflare Proxy Test

# 定时跑优选测试：拉取多源 → CF 内统一判定 → 地区补全 → 提交结果文件
on:
  schedule:
    - cron: '23 */6 * * *'    # 每 6 小时一次（UTC：00/06/12/18:23 = 北京 08/14/20/次日02:23，避开整点高峰）
  workflow_dispatch:           # 支持手动触发

permissions:
  contents: write              # 允许提交结果文件回仓库

concurrency:                    # 上一次还没跑完时不叠加新任务
  group: senflare-proxy-test
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # 全量约 3.2 万节点，OTC 批量实测 7.7 节点/秒 → 约 70 分钟
    steps:
      - name: 📦 检出仓库
        uses: actions/checkout@v4

      - name: 🐍 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🔎 运行优选测试(拉源 → CF 内统一判定 → 产物)
        run: python Start.py

      - name: 💾 提交结果/地区缓存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 分开 add：任一文件本次未生成（如无节点需查地区时没有缓存文件）不影响另一个的提交
          git add Senflare-Proxy.txt || true
          git add Senflare-Proxy-All.txt || true
          git add Senflare-Country.json || true
          git add Senflare-Proxy-Bidirectional.txt Senflare-Proxy-Invalid.txt || true
          if git diff --cached --quiet; then
            echo "✅ 结果无变化，跳过提交"
          else
            git commit -m "🔄 数据更新 $(TZ=Asia/Shanghai date +%Y-%m-%d-%H:%M) [ Senflare Proxy]"
            # 运行期间有人推了代码则 rebase 后再推，否则必被 fetch first 拒绝；冲突则直接失败，不覆盖远端
            git pull --rebase origin main
            git push
          fi
